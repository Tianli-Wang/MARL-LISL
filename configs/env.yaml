graph_dir: data/graphs/dmax_2000km
graph_backend: packed
graph_pack_dir: data/graphs/dmax_2000km/_packed
graph_pack_build_if_missing: true
traffic_dir: data/traffic
traffic_train_path: data/traffic/traffic_pairs_train.npy
traffic_eval_path: data/traffic/traffic_pairs_eval.npy
traffic_stress_path: data/traffic/traffic_pairs_stress.npy

candidates:
  enabled: true
  backend: packed
  pack_build_if_missing: true
  train_dir: data/candidates/train
  eval_dir: data/candidates/eval
  stress_dir: data/candidates/stress
  cache_size: 64

num_steps: 721
num_sats: 6080
dt: 5.0

# 高性能机器默认仿真规模：16 条业务流、每流 8 条候选路径。
# 若只做快速冒烟测试，可临时改回 num_flows=4、num_candidates=5。
num_flows: 16
num_candidates: 8

# 同一时隙内按 flow 并行生成候选路径；不必超过 num_flows 太多。
parallel_workers: 128

# 至少覆盖 future_window 附近的图，避免 future mutex 和 next_obs 反复解压同一批 npz。
graph_cache_size: 64

# packed 后端使用共享 memmap；多进程训练时不要让每个 worker 各自 preload 一份图。
graph_preload: false

path_weight:
  engine: scipy
  method: penalized_shortest
  diversity_penalty: 1.0
  max_attempts_multiplier: 4
  propagation: 1.0
  setup: 1.0
  lifetime: 0.1
  lifetime_epsilon: 1.0

reward_weights:
  avg_delay: 1.0
  peak_delay: 0.5
  switch_count: 0.1
  new_link_count: 0.1
  outage: 10.0
  mutex: 5.0

future_mutex:
  enabled: true
  future_window: 24
  future_discount: 0.95
  node_mutex_path: data/mutex/node_mutex.npy
  strict_node_mutex: true
  include_source_dest_nodes: false

proactive_rule:
  enabled: true
  min_b_avoid: 1.0
  setup_cost_limit: null
  prefer_low_delay_when_tie: true

traffic:
  seed: 42
  train_num_sets: 1
  eval_num_sets: 1
  min_source_dest_hops: 2
  max_retry: 20000
  stress:
    enabled: true
    output_path: data/traffic/traffic_pairs_stress.npy
    num_flows: 16
    num_candidate_pairs: 200
    target_step: 0
    max_paths_to_check: 200
    min_shared_relay_nodes: 1
    demand: 1.0

env:
  episode_start: 0
  episode_length: 721
  train_random_start: true
  train_min_steps: 256
  action_invalid_penalty: 5.0
