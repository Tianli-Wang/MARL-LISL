# 图快照目录；由 scripts/preprocess/02_build_graph_snapshots.py 生成。
graph_dir: data/graphs/dmax_2000km
# 图读取后端：packed 表示使用共享 memmap，适合多进程训练；lazy 表示逐 npz 懒加载。
graph_backend: packed
# packed 图数据目录；可由 scripts/preprocess/08_pack_graphs.py 生成。
graph_pack_dir: data/graphs/dmax_2000km/_packed
# 若 packed 图不存在，环境初始化时是否自动构建。
graph_pack_build_if_missing: true

# traffic pairs 输出与读取目录。
traffic_dir: data/traffic
# 训练、评估、压力测试三套源宿业务流文件。
traffic_train_path: data/traffic/traffic_pairs_train.npy
traffic_eval_path: data/traffic/traffic_pairs_eval.npy
traffic_stress_path: data/traffic/traffic_pairs_stress.npy

# 候选路径配置；训练/评估时应只查表，不在线跑最短路。
candidates:
  # 是否启用离线预计算候选路径。
  enabled: true
  # 候选路径读取后端：packed 使用 _packed 下的 memmap；npz 使用 cand_XXXX.npz 小文件。
  backend: packed
  # 若候选路径 pack 不存在，是否自动从 cand_XXXX.npz 打包。
  pack_build_if_missing: true
  # train/eval/stress 三套候选路径目录。
  train_dir: data/candidates/train
  eval_dir: data/candidates/eval
  stress_dir: data/candidates/stress
  # 每个环境进程内缓存最近多少个时隙的候选路径。
  cache_size: 64

# 仿真总时隙数、卫星数量和时隙长度。
num_steps: 721
num_sats: 6080
dt: 5.0

# 高性能机器默认仿真规模：16 条业务流、每流 8 条候选路径。
# 若只做快速冒烟测试，可临时改回 num_flows=4、num_candidates=5。
num_flows: 16
num_candidates: 8

# 离线预计算候选路径等预处理任务的并行 worker 数。
parallel_workers: 128

# 图 LRU 缓存大小；packed 后端下缓存的是 memmap 切片和派生索引。
graph_cache_size: 64

# packed 后端使用共享 memmap；多进程训练时不要让每个 worker 各自 preload 一份图。
graph_preload: false

# 候选路径搜索代价函数与生成方法。
path_weight:
  # scipy 使用稀疏 Dijkstra，快；networkx 可配合 yen 做精确 K-shortest，但很慢。
  engine: scipy
  # penalized_shortest 用边惩罚重复 Dijkstra 生成多样候选；yen 为精确简单路径排序。
  method: penalized_shortest
  # 已使用边的权重惩罚系数，越大越鼓励候选路径差异。
  diversity_penalty: 1.0
  # 为得到 K 条不重复路径，最多尝试 K * 该倍数 次 Dijkstra。
  max_attempts_multiplier: 4
  # 传播时延权重。
  propagation: 1.0
  # 新链路建立时延权重。
  setup: 1.0
  # 剩余寿命倒数项权重；鼓励选择寿命更长的链路。
  lifetime: 0.1
  # 防止 lifetime 倒数项除零。
  lifetime_epsilon: 1.0

# 全局 cooperative reward 的各项惩罚权重；reward 为这些代价的负值。
reward_weights:
  # 平均时延惩罚。
  avg_delay: 1.0
  # 峰值时延惩罚。
  peak_delay: 0.5
  # 切换路径次数惩罚。
  switch_count: 0.1
  # 新建链路数量惩罚。
  new_link_count: 0.1
  # 当前路径不可用/掉线惩罚。
  outage: 10.0
  # future mutex 冲突惩罚。
  mutex: 5.0

# 未来节点互斥检测配置。
future_mutex:
  # 是否启用未来互斥检测与惩罚。
  enabled: true
  # reward 计算使用的未来窗口长度；越大越准确但越慢。
  future_window: 24
  # observation 中 A_mutex/B_avoid 使用的短窗口；训练热路径主要受它影响。
  observation_window: 8
  # 未来时隙冲突折扣系数。
  future_discount: 0.95
  # 节点互斥容量文件，由 scripts/preprocess/05_build_mutex.py 生成。
  node_mutex_path: data/mutex/node_mutex.npy
  # 是否严格按节点容量判定冲突。
  strict_node_mutex: true
  # 节点占用统计是否包含源节点和目的节点；通常只看中继节点。
  include_source_dest_nodes: false
  # 路径边编码/中继节点统计缓存容量，减少训练时重复编码。
  path_cache_size: 200000

# 手工主动规避规则 baseline 的参数。
proactive_rule:
  # 是否启用规则策略配置。
  enabled: true
  # 候选路径相对保持动作至少减少多少 future mutex 才触发切换。
  min_b_avoid: 1.0
  # 可选的新链路建立时延上限；null 表示不限制。
  setup_cost_limit: null
  # 规避收益相同的时候是否优先低时延路径。
  prefer_low_delay_when_tie: true

# 业务流源宿对生成配置。
traffic:
  # 随机种子。
  seed: 42
  # 当前实现保存一套训练 traffic。
  train_num_sets: 1
  # 当前实现保存一套评估 traffic。
  eval_num_sets: 1
  # 源宿对在 graph_0000 上的最小跳数，避免太近的简单业务。
  min_source_dest_hops: 2
  # 采样源宿对失败后的最大重试次数。
  max_retry: 20000
  # 更容易触发 future mutex 的压力测试 traffic 配置。
  stress:
    # 是否生成 stress traffic。
    enabled: true
    # stress traffic 输出路径。
    output_path: data/traffic/traffic_pairs_stress.npy
    # stress traffic 中的业务流数量，应与 num_flows/MAPPO num_agents 对齐。
    num_flows: 16
    # 随机采样多少候选源宿对用于挑选共享中继节点流。
    num_candidate_pairs: 200
    # 用哪个时隙的图生成 stress traffic。
    target_step: 0
    # 最多检查多少条候选最短路径。
    max_paths_to_check: 200
    # 被选业务流至少倾向共享多少个中继节点。
    min_shared_relay_nodes: 1
    # 每条业务流需求量；当前环境主要保留该字段。
    demand: 1.0

# 环境 episode 配置。
env:
  # episode 默认起始时隙。
  episode_start: 0
  # episode 最大长度；721 表示覆盖完整一天/全轨迹数据。
  episode_length: 721
  # 训练 reset 时是否随机起点，提升时间覆盖并减少过拟合 k=0。
  train_random_start: true
  # 随机起点后至少保留多少步可交互。
  train_min_steps: 256
  # 非法动作惩罚系数。
  action_invalid_penalty: 5.0
