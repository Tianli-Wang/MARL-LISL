seed: 42
device: cuda
torch_num_threads: 8

multiprocessing_start_method: spawn
num_envs: 32
rollout_length: 256
total_updates: 500

num_agents: 16
num_actions: 9
obs_dim: 8
state_dim: 7

gamma: 0.99
gae_lambda: 0.95

clip_ratio: 0.2
value_clip_range: 0.2
target_kl: 0.03
ppo_epochs: 4
minibatch_size: 1024

learning_rate: 0.0002
value_coef: 0.5
entropy_coef: 0.003
max_grad_norm: 0.5

normalize_advantages: true

actor:
  hidden_dim: 256
  num_layers: 3
  activation: relu
  normalize_input: true
  heuristic_prior:
    enabled: true
    scale: 1.0
    delay: 4.0
    setup: 4.0
    new_link: 0.08
    hops: 0.0
    mutex: 5.0
    avoid: 0.0
    keep_bonus: 0.05

critic:
  hidden_dim: 512
  num_layers: 3
  activation: relu

logging:
  log_interval: 5
  save_interval: 50
  eval_interval: 0

output:
  run_root: outputs/runs
  experiment_name: mappo_a100_16flow_vec
