seed: 42
device: cuda

num_envs: 1
rollout_length: 512
total_updates: 1000

num_agents: 16
num_actions: 9
obs_dim: 8
state_dim: 7

gamma: 0.99
gae_lambda: 0.95

clip_ratio: 0.2
ppo_epochs: 5
minibatch_size: 256

learning_rate: 0.0003
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

normalize_advantages: true

actor:
  hidden_dim: 256
  num_layers: 3
  activation: relu

critic:
  hidden_dim: 512
  num_layers: 3
  activation: relu

logging:
  log_interval: 5
  save_interval: 50
  eval_interval: 50

output:
  run_root: outputs/runs
  experiment_name: mappo_a100_16flow
