# 随机种子，控制 PyTorch/NumPy/Python 随机性。
seed: 43
# 训练设备；cuda 使用 A100，若无 GPU 代码会回退到 CPU。
device: cuda
# PyTorch 计算线程数；环境进程很多时不要设太大，避免线程过度竞争。
torch_num_threads: 8

# 多进程环境启动方式；auto 在 Linux 优先 fork，在 Windows 自动使用 spawn。
multiprocessing_start_method: auto
# 并行环境数量；512 线程服务器上 64 个 env 能显著降低 rollout 时间。
num_envs: 20
# 每个 env 每次 update 采样多少步；总样本数为 num_envs * rollout_length。
rollout_length: 32
# PPO 总更新次数；当前配置约几十分钟级训练一轮。
total_updates: 250

# 必须与 env.yaml 中 num_flows 对齐。
num_agents: 16
# 动作数 = 1 个保持动作 + num_candidates 个候选路径动作。
num_actions: 9
# 单个动作候选的观测特征维度。
obs_dim: 8
# centralized critic 的 state 维度：7 个全局量 + 16 条流 × 10 个逐流摘要。
state_dim: 167

# 折扣因子。
gamma: 0.99
# GAE(lambda) 参数，越接近 1 越平滑但方差可能更高。
gae_lambda: 0.95

# PPO policy clipping 范围。
clip_ratio: 0.2
# 启用 ValueNorm 后先关闭 value clipping：运行均值/方差更新会改变标准化坐标，
# 独立 Critic 梯度裁剪已负责限制单次更新。若关闭 ValueNorm，可再设为 0.2。
value_clip_range: null
# 近似 KL 超过该值时提前停止本轮 PPO epoch。
target_kl: 0.03
# 每个 rollout 重复训练多少轮 PPO。
ppo_epochs: 3
# PPO minibatch 大小；当前每轮有 20×32=640 个样本，256 可产生 3 个
# minibatch，避免旧值 1024 导致每个 epoch 实际只有一次 Critic 更新。
minibatch_size: 256

# 旧配置兼容用的统一 Adam 学习率；新训练优先读取下面两项独立学习率。
learning_rate: 0.0002
# Actor 学习率保持原值，避免 Critic 修复同时放大策略更新。
actor_learning_rate: 0.0002
# Critic 使用更高学习率，以更快跟上非平稳的联合策略回报。
critic_learning_rate: 0.0005
# critic loss 权重。
value_coef: 0.5
# entropy bonus 权重；鼓励探索，过大时会导致切换过多。
entropy_coef: 0.010
# 旧配置兼容用的统一梯度裁剪阈值。
max_grad_norm: 0.5
# Actor 与 Critic 分开反向传播、分开裁剪。
max_actor_grad_norm: 0.5
max_critic_grad_norm: 1.0

# 是否标准化 advantage，通常保持 true。
normalize_advantages: true

# Actor 网络配置：共享 MLP，为每个候选动作输出 logit。
actor:
  # Actor 隐藏层宽度。
  hidden_dim: 256
  # Actor 隐藏层数量。
  num_layers: 3
  # 激活函数，可选 relu/tanh/elu/gelu。
  activation: relu
  # 是否对动作特征做 LayerNorm。
  normalize_input: true
  # 启发式 action prior：给策略一个接近规则 baseline 的初始偏置，减少早期乱切换。
  heuristic_prior:
    # 是否启用启发式 prior。
    enabled: true
    # prior 总缩放系数。
    scale: 1.0
    # 时延惩罚系数。
    delay: 4.0
    # 建链时延惩罚系数。
    setup: 4.0
    # 新链路数量惩罚系数。
    new_link: 0.08
    # 跳数惩罚系数；当前为 0，不额外惩罚跳数。
    hops: 0.0
    # future mutex 惩罚系数。
    mutex: 5.0
    # B_avoid 奖励系数；当前为 0，由 mutex 项间接体现。
    avoid: 0.0
    # 对保持动作的小偏置，减少无意义频繁切换。
    keep_bonus: 0.05

# Centralized critic 网络配置。
critic:
  # Critic 隐藏层宽度。
  hidden_dim: 512
  # Critic 隐藏层数量。
  num_layers: 3
  # 激活函数。
  activation: relu
  # 按特征维护运行均值/方差；相比逐样本 LayerNorm，能保留绝对拓扑与冲突水平。
  state_normalization: running
  # 标准化 state 的裁剪范围，防止未见过的极端拓扑统计产生异常梯度。
  state_normalization_clip: 10.0
  # Critic 拟合标准化 return；GAE 与评估仍使用反标准化后的原始 reward 尺度。
  value_normalization: true
  # 运行统计的伪样本数与标准化分母 epsilon。
  running_statistics_epsilon: 0.0001
  normalization_epsilon: 0.00000001

# 日志、checkpoint 与在线评估频率。
logging:
  # 每多少个 update 打印一次训练指标。
  log_interval: 5
  # 每多少个 update 保存一次 checkpoint。
  save_interval: 50
  # 旧配置兼容字段；新训练使用下面独立 validation.interval。
  eval_interval: 0

# 固定验证与模型选择。训练 rollout 仍使用 train traffic 和随机起点；这里始终
# 使用 eval traffic、k=0 和确定性 argmax，专门防止 latest 后期退化。
validation:
  enabled: true
  # 每 25 个 update 完整验证一次，同时允许捕获 50 与 100 之间的最佳点。
  interval: 25
  traffic_split: eval
  episode_start: 0
  # null 表示使用 num_steps，即完整运行 721 个时隙。
  episode_length: 721
  max_steps: null
  num_episodes: 1
  seed: 42
  # 连续 3 次固定验证未改善时提前结束；首次验证一定会生成 best.pt。
  early_stopping_patience: 3
  # 至少训练到 75 update 才允许早停，避免初期偶然波动过早终止。
  early_stopping_min_updates: 75

# 输出目录配置。
output:
  # 训练 run 根目录。
  run_root: outputs/runs
  # 实验名会拼接到 timestamp 后面。
  experiment_name: mappo_16flow_vec
